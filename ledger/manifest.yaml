# Statement manifest for the exploding-sandpile shape theorem.
#
# One entry per Lean statement of the paper.  The bytes between the
# FROZEN-STATEMENT markers fix the statement: a proof follows the end marker and
# never changes it.  `frozen_sha256` is the SHA-256 of exactly those bytes, and
# `closure_sha256` that of the Exploding declarations the statement uses.
#
# States: PROVED (a complete proof exists and its axiom closure contains only the
# standard axioms) and FROZEN (a cited result, or a definition, stated as a
# proposition and taken as a hypothesis by the theorems that use it).  Every entry
# cites the corrected edition `source_pin.file`; its TeX inputs are pinned under
# `source_pin.inputs`.

