fidelity:
  divergences: The corrected arXiv-format v11 draft is the default source for paper-owned declarations.
    RULINGS.md records the exact seven source-facing successors, delivered-seed interpretation and source
    identity transport. Official arXiv v2 and abstract bytes remain unchanged. Arrival times use extended
    naturals and explicit finite witnesses before real bounds; graph interior uses the existing inner
    boundary; full Boolean boundary data and time-zero clauses are retained. Nonnegativity is proved from
    the source hypotheses rather than assumed. Historical input declarations retain their literal bodies
    and citation scopes. The two radius predicates are unproved cited results; the planar optimality
    remark has its own registration and audit record.
