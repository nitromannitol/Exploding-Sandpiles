fidelity:
  divergences: >-
    The journal default is paper/exploding.tex. Proposition 3.1, Lemmas 3.5, 3.6, 3.7 and Proposition 4.1 select the
    official arXiv extraction and its defs.tex input; ten declarations select
    local corrected arXiv-format v10 and its defs.tex input. Theorem 1.4 version 4 and Proposition
    2.2 version 5 select that corrected source; Theorem 1.4 retains its Schonmann input and
    Proposition 2.2 retains its three cited inputs. The corrected
    crossing row explicitly includes terminal one and a positive volume deadline;
    corrected Theorem 1.3 version 6 includes the actual homogeneous-law endpoint;
    other corrected-v10 results are not certified here. CORRESPONDENCE.md records how
    each statement of the paper is read in Lean. In summary: arrival and crossing times are
    valued in the extended naturals, so that the paper's infinity is not a junk value, and
    bounds against real quantities assert a natural number equal to the time; locally
    uniform convergence is written in its epsilon form; the finiteness of a component or of
    a bounding rectangle is carried where a cardinality would otherwise absorb it; the
    standing hypotheses of Sections 2 to 4 are explicit hypotheses of the deterministic
    lemmas; "convex domain" is a nonempty open convex set; Proposition 7.2 writes the
    paper's d as d + 1. Lemma 3.2 version 7 and official Lemmas 3.5, 3.6, 3.7
    Proposition 3.1 and Proposition 4.1 version 5, corrected Theorem 1.3 version 6, and Proposition 2.2 version 5 include the valid Bernoulli endpoint p = 1; one remaining Bernoulli paper
    row still restricts p to (0, 1), although the
    source's "Fix p > 0" also includes that deterministic background.

