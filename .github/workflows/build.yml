name: CI

# Builds the project and the Mathlib-only comparator surface on GitHub-hosted runners
# (`ubuntu-latest`).  No `pull_request` trigger: a fork's pull request would run with this
# repository's Actions cache in scope.  Manual dispatch only until the public release, so that
# pushes to the private repository do not start Mathlib-scale runs; the release adds
# `push: branches: [main]`.
on:
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, axiom audit, checkers
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install elan
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Get the Mathlib cache
        run: lake exe cache get

      # The production build emits no warning: the library contains no `sorry`.
      # tools/check_warnings.py (run by tools/verify.py below) fails on any warning.
      - name: Build
        run: lake build

      # Build the Mathlib-only comparator surface: the challenge elaborates with its one
      # intentional `sorry`, and its vocabulary block is byte-identical to the solution's.
      - name: Build the Mathlib-only comparator surface
        run: lake build ExplodingAudit

      - name: Check the challenge vocabulary is self-consistent
        run: bash ExplodingAudit/check_standalone.sh --vocabulary

      # Build the axiom audit and surface its `#print axioms` output in the log,
      # confirming the proved results use only the standard Mathlib axioms.
      - name: Axiom audit
        shell: bash
        run: |
          set -o pipefail
          lake build Exploding.Meta.AxiomsAudit 2>&1 | tee axioms-audit.log
          python3 - axioms-audit.log <<'PY'
          import re, sys
          data = open(sys.argv[1], "rb").read().decode("utf-8", "replace")
          marker = "depends on axioms"
          lines = data.split("\n")
          records, i = [], 0
          while i < len(lines):
              if marker in lines[i]:
                  rec = lines[i].rstrip()
                  # Lean continues a wrapped axiom list on indented lines that carry no new record.
                  while (not rec.endswith("]") and i + 1 < len(lines)
                         and lines[i + 1].startswith(" ") and marker not in lines[i + 1]):
                      i += 1
                      rec += " " + lines[i].strip()
                  records.append(" ".join(rec.split()))
              i += 1
          exact = re.compile(r"^.*' depends on axioms: \[propext, Classical\.choice, Quot\.sound\]$")
          bad = [r for r in records if r.count(marker) != 1 or not exact.match(r)]
          if not records:
              sys.exit("The axiom audit printed no axiom lists.")
          if bad or data.count(marker) != len(records):
              print("\n".join(bad))
              sys.exit("A proved result depends on an axiom other than the three standard ones.")
          print(f"Axiom audit: {len(records)} axiom lists, each exactly propext, Classical.choice and Quot.sound.")
          PY

      - name: Frozen statements, paper correspondence and axiom closures
        run: |
          python3 -m pip install -r tools/requirements.txt
          python3 tools/verify.py
