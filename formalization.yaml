version: "v0.4"

project:
  name: "A shape theorem for exploding sandpiles"
  description: >-
    A Lean 4 formalization of the paper "A shape theorem for exploding sandpiles" by Bou-Rabee
    (Annals of Applied Probability 34(1A) (2024); arXiv:2102.04422), in the corrected edition of
    its arXiv v2 source. All 24 numbered results of the corrected edition, and its Remark 1, are
    proved in Lean: 22 stated by the paper, and Theorem 1.1 and Proposition 7.4, which the paper
    quotes from other works. Proposition 7.1 is proved in every dimension d >= 1. The nine results
    of other works that the statements use are proved in this repository or in Lattice-Probability.
    The one remaining hypothesis is Hypothesis 1 of Section 5, used in a stronger form than printed.
    The comparator pairs under ExplodingAudit/ restate Theorems 1.2, 1.3 and 5.1 over Mathlib alone,
    and a fourth restates Theorem 1.2 with four cited results as hypotheses.
  authors:
  - Ahmed Bou-Rabee
  responsible_maintainers:
  - Ahmed Bou-Rabee
  license: Apache-2.0

classification:
  arxiv:
  - math.PR
  msc2020:
  - 60K35
  - 60K37

sources:
- title: A shape theorem for exploding sandpiles
  authors:
  - Ahmed Bou-Rabee
  id: doi:10.1214/23-AAP1976
  url: https://arxiv.org/abs/2102.04422
  type: journal article
  relationship: published version, corrected in the corrected edition
  note: "Annals of Applied Probability 34(1A) (2024), 714-742; arXiv:2102.04422."
- title: A shape theorem for exploding sandpiles, arXiv v2 source
  authors:
  - Ahmed Bou-Rabee
  id: arXiv:2102.04422v2
  url: https://arxiv.org/abs/2102.04422v2
  type: arXiv source
  location: paper/exploding-arxiv.tex
  relationship: unmodified source of the corrected edition
- title: A shape theorem for exploding sandpiles, corrected edition
  authors:
  - Ahmed Bou-Rabee
  type: corrected source
  location: paper/corrected-arxiv/exploding-corrected-arxiv.tex
  relationship: formalized
  note: "The statements follow this text. Its section \"Corrections to the published version\" lists every change from arXiv v2."

related_formalizations:
- id: https://github.com/nitromannitol/Lattice-Probability
  relationship: builds-on
  note: "Lattice-Probability, at commit 7f773dd0aa66dbe1ed1080ae0248906b9cfe5215; its bond model at commit 7512f4fbbc3e3d3ecf3e1af8a450ca7f4f082069 is copied in Exploding/Support/LatticeBond/."
- id: https://github.com/nitromannitol/Percolation-Rigidity
  relationship: builds-on
  note: "Uniform slab connectivity above the critical probability (the slab form of the theorem of Grimmett and Marstrand) and the slab crossing estimates, copied in Exploding/Rigidity/ from commit d5b6dd0b0019636ea3c88ad0f7da087a6ac194c3, with the modules of anthropics/formal-math (commit 795efb86f191735c5481675763537cfb4ff37e55, Apache License 2.0) that it copies; see the section Copied code of README.md."

status:
  scope: >-
    All 24 numbered results of the corrected edition and its Remark 1 are proved in Lean, with no `sorry` and only the standard axioms: 22 stated by the paper, and Theorem 1.1 and Proposition 7.4, which the paper quotes from other works. Proposition 7.1 is proved in every dimension d >= 1. No result of another work is assumed. Some declarations in Exploding/MainTheorems.lean are earlier forms that take a result of another work as an explicit hypothesis; the declarations that the README lists have forms without it, and the hypotheses themselves are proved. Theorem 6.1 is stated as published, Theorems 1.2 and 1.3 as published with the law (2) read as one common law at every site, and Theorems 1.4 and 5.1 with the corrections listed in the corrected edition. Theorem 5.1 and Propositions 5.1 and 7.1 also assume Hypothesis 1 in a stronger form than printed, and whether they hold under the printed form is open.
  additional_results: >-
    The high-density chemical-distance bound is proved as Exploding.xap12_high_density_bound.
    Each of the 11 registered statements using the full Antal–Pisztora hypothesis has a form
    without it: Exploding.limit_shape_unconditional, Exploding.convergence_of_time_constant_unconditional,
    Exploding.renormalization_properties_unconditional, Exploding.finite_exploding_unconditional,
    Exploding.last_penultimate_cluster_unconditional, Exploding.penultimate_upper_bound_unconditional,
    Exploding.last_penultimate_close_unconditional, Exploding.convergence_of_the_last_wave_unconditional,
    Exploding.approximate_subadditive_unconditional,
    Exploding.convergence_of_the_generalized_last_wave_unconditional, and
    Exploding.generalized_convergence_unconditional. The full all-supercritical Antal–Pisztora
    statement is proved as Exploding.External.antalPisztoraChemicalDistance_holds: in dimension
    two as Exploding.antalPisztora_dim_two, and in dimensions d ≥ 3 from uniform two-point
    connectivity in slabs above the critical probability
    (Exploding.antalPisztoraChemicalDistance_of_slabConnectivity), the slab form of the theorem of
    Grimmett and Marstrand, proved in Percolation-Rigidity and copied here
    (Exploding.latticeBond_uniformCubeSlabConnectivity_of_criticalProbability_lt).
  sorry_count: 0
  sorry_count_scope: "Exploding/ (the production library)"
  comparator_challenge_sorry_count: 4
  sorry_in_definitions: 0
  axioms:
  - propext
  - Classical.choice
  - Quot.sound
  main_results:
  - declaration: "Exploding.limit_shape"
    unconditional_declaration: "Exploding.limit_shape_unconditional"
    unconditional_file: "Exploding/Support/LimitShapeUnconditional.lean"
    file: "Exploding/MainTheorems.lean"
    statement: "Theorem 1.2"
    sorry_count: 0
    axioms: ["propext", "Classical.choice", "Quot.sound"]
    comparator_config: "ExplodingAudit/LimitShape/comparator.json"
    unconditional_comparator_config: "ExplodingAudit/LimitShapeUnconditional/comparator.json"
    literature_dependencies:
    - "Antal and Pisztora, Theorem 1.1 (hChem), an explicit hypothesis of the registered declaration, proved as Exploding.External.antalPisztoraChemicalDistance_holds; the unconditional declaration uses the proved high-density bound"
  - declaration: "Exploding.convergence_of_time_constant"
    unconditional_declaration: "Exploding.convergence_of_time_constant_unconditional"
    unconditional_file: "Exploding/Support/TimeConstantUnconditional.lean"
    file: "Exploding/MainTheorems.lean"
    statement: "Theorem 1.3"
    sorry_count: 0
    axioms: ["propext", "Classical.choice", "Quot.sound"]
    comparator_config: "none"
    unconditional_comparator_config: "ExplodingAudit/TimeConstantUnconditional/comparator.json"
    literature_dependencies:
    - "Antal and Pisztora, Theorem 1.1 (hChem), an explicit hypothesis of the registered declaration, proved as Exploding.External.antalPisztoraChemicalDistance_holds; the unconditional declaration uses the proved high-density bound"
  - declaration: "Exploding.explosive"
    file: "Exploding/MainTheorems.lean"
    statement: "Theorem 1.4"
    sorry_count: 0
    axioms: ["propext", "Classical.choice", "Quot.sound"]
    comparator_config: "none"
    literature_dependencies: []
  - declaration: "Exploding.generalized_convergence"
    unconditional_declaration: "Exploding.generalized_convergence_unconditional"
    unconditional_file: "Exploding/Support/GeneralizedConvergenceUnconditional.lean"
    file: "Exploding/MainTheorems.lean"
    statement: "Theorem 5.1"
    sorry_count: 0
    axioms: ["propext", "Classical.choice", "Quot.sound"]
    comparator_config: "none"
    unconditional_comparator_config: "ExplodingAudit/GeneralizedConvergenceUnconditional/comparator.json"
    literature_dependencies:
    - "Antal and Pisztora, Theorem 1.1 (hChem), an explicit hypothesis of the registered declaration, proved as Exploding.External.antalPisztoraChemicalDistance_holds; the unconditional declaration uses the proved high-density bound"
  - declaration: "Exploding.counterexample"
    file: "Exploding/MainTheorems.lean"
    statement: "Theorem 6.1"
    sorry_count: 0
    axioms: ["propext", "Classical.choice", "Quot.sound"]
    comparator_config: "none"
    literature_dependencies: []

