version: "v0.4"

project:
  name: "Exploding-Sandpiles"
  description: >-
    A Lean 4/Mathlib formalization of "A shape theorem for exploding sandpiles"
    (Bou-Rabee, Annals of Applied Probability 34(1A) (2024), 714-742; arXiv:2102.04422):
    the limit shape of the exploding sandpile (Theorem 1.2), the convergence of the
    rescaled arrival times to a continuous, convex, one-homogeneous function
    (Theorem 1.3), the explosion criterion for product backgrounds (Theorem 1.4),
    convergence under general hypotheses (Theorem 5.1) and explosive backgrounds
    without a limit shape (Theorem 6.1), together with the numbered statements
    registered from the pinned manuscript. Seven cited results enter as explicit
    hypotheses; six are also proved in the repository. Some registered statements
    have narrower scope than the source, and later arXiv corrections are not yet
    fully covered. The historical limit shape declaration is independently checked
    by the ExplodingAudit/ comparator pair.
  authors:
    - "Ahmed Bou-Rabee"
  license: "Apache-2.0"

classification:
  arxiv:
    - "math.PR"
  msc2020:
    - "60K35"
    - "60K37"

sources:
  - title: "A shape theorem for exploding sandpiles"
    authors:
      - "Ahmed Bou-Rabee"
    id: "arXiv:2102.04422"
    url: "https://arxiv.org/abs/2102.04422"
    type: "journal article"
    relationship: "formalizes"
    note: >-
      The paper under formalization, in the corrected copy paper/exploding.tex;
      paper/CHANGES_FROM_ARXIV.md lists each difference from arXiv:2102.04422v2.
    license: ""
    author_contacted: "n/a"
    prior_work: ""

related_formalizations:
  - id: "https://github.com/nitromannitol/Lattice-Probability"
    relationship: "builds-on"
    note: >-
      The shared public Lean library Lattice-Probability (LatticeProb), pinned git
      dependency at commit bbe0b90a7cf0517db0578139aaab7f152edbc45e; it supplies
      lattice sites, the nearest-neighbour graph and components of subsets of the lattice.

status:
  scope: >-
    The pinned historical manuscript has 22 registered paper theorem rows, each
    PROVED as its exact Lean declaration. Lemma 3.2 version 7 includes the p = 1
    endpoint. Their current Lean proofs have no sorry
    and close to propext, Classical.choice and Quot.sound. The registered rows cover
    Theorems 1.2, 1.3, 1.4, 5.1 and 6.1,
    Propositions 2.1, 2.2, 3.1, 4.1, 5.1, 7.1, 7.2, 7.3 and 7.5, and Lemmas 2.1 and
    3.1 to 3.7. SCOPE BOUNDARY: seven results the paper cites are stated as
    propositions in Exploding/External/ and carried as explicit hypotheses by the
    statements whose proofs use them, not as axioms: the explosion theorem of Fey,
    Levine and Peres (Theorem 1.1), Schonmann's bound for bootstrap percolation
    (Proposition 7.4), Theorem 0.0 and Corollary 1.4 of Liggett, Schonmann and Stacey,
    Theorem 1.1 of Antal and Pisztora, Lemma 5.2 of Mathieu and Theorem 2.8 of Fey,
    Meester and Redig (ASSUMPTIONS.md). Six of the seven are also proved in this
    repository: the least-action principle of Fey, Meester and Redig
    (Exploding.xfmr_proved), both domination theorems of Liggett, Schonmann and Stacey
    (Exploding.xlse_lss_bounded_degree and Exploding.xlse_lss_general), the hole bound
    of Mathieu (Exploding.xmf_proved), Schonmann's bound (Exploding.xsr_schonmann), and
    the explosion theorem of Fey, Levine and Peres, derived from Schonmann's bound
    (Exploding.xsr_flp, which applies Exploding.LSProof.ls_flp_from_explosive to
    Exploding.xsr_schonmann). Only Theorem 1.1 of Antal and Pisztora (the chemical
    distance in supercritical bond percolation) is assumed outright. The frozen
    statements still take the cited results as hypotheses; discharging them with
    these proofs, Theorem 6.1, Theorem 1.4 and Proposition 7.5 hold with no cited
    hypothesis, and Theorems 1.2, 1.3 and 5.1 rest on the Antal-Pisztora bound alone
    (Theorem 5.1 together with the model hypotheses of Section 5). The formalized
    paper source currently pinned by the manifest is paper/exploding.tex;
    paper/CHANGES_FROM_ARXIV.md lists its differences from arXiv:2102.04422v2.
    The nine other Bernoulli paper rows with p < 1 still omit the valid p = 1
    endpoint, and the separate corrected arXiv draft has additional unregistered
    or stronger statements. Thus the registry is not a full source-fidelity
    certificate for either arXiv version. Not formalized: the proof outline of
    Section 1, the examples of Section 5.2 and the figures. Registered public
    wrappers are in Exploding/MainTheorems.lean. A Mathlib-only comparator challenge
    for Theorem 1.2 is ExplodingAudit/LimitShape/Challenge.lean; the checked statement
    carries the four cited results the theorem uses as hypotheses.
  sorry_count: 0
  sorry_count_scope: "Exploding production library only"
  comparator_challenge_sorry_count: 1
  sorry_in_definitions: 0
  axioms:
    - "propext"
    - "Classical.choice"
    - "Quot.sound"
  main_results:
    - declaration: "Exploding.Frozen.limit_shape"
      file: "Exploding/Frozen/LimitShape.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "ExplodingAudit/LimitShape/comparator.json"
      literature_dependencies:
        - statement: "Liggett, Schonmann and Stacey, Domination by product measures, Corollary 1.4 (Exploding.External.LiggettSchonmannStaceyBoundedDegree, an explicit hypothesis; proved in this repository by Exploding.xlse_lss_bounded_degree)"
        - statement: "Mathieu, Quenched invariance principles for random walks with random conductances, Lemma 5.2 (Exploding.External.MathieuHoleVolume, an explicit hypothesis; proved in this repository by Exploding.xmf_proved)"
        - statement: "Antal and Pisztora, On the chemical distance for supercritical Bernoulli percolation, Theorem 1.1 (Exploding.External.AntalPisztoraChemicalDistance, an explicit hypothesis, assumed)"
        - statement: "Schonmann, On the behavior of some cellular automata related to bootstrap percolation (Exploding.External.SchonmannBootstrap, an explicit hypothesis; proved in this repository by Exploding.xsr_schonmann)"
    - declaration: "Exploding.Frozen.convergence_of_time_constant"
      file: "Exploding/Frozen/TimeConstant.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      literature_dependencies:
        - statement: "Fey, Levine and Peres, Growth rates and explosions in sandpiles, Proposition 1.4 (Exploding.External.FeyLevinePeresExplosive, an explicit hypothesis; proved in this repository by Exploding.xsr_flp, which derives it from Schonmann's bound)"
        - statement: "Liggett, Schonmann and Stacey, Domination by product measures, Corollary 1.4 (Exploding.External.LiggettSchonmannStaceyBoundedDegree, an explicit hypothesis; proved in this repository by Exploding.xlse_lss_bounded_degree)"
        - statement: "Mathieu, Quenched invariance principles for random walks with random conductances, Lemma 5.2 (Exploding.External.MathieuHoleVolume, an explicit hypothesis; proved in this repository by Exploding.xmf_proved)"
        - statement: "Antal and Pisztora, On the chemical distance for supercritical Bernoulli percolation, Theorem 1.1 (Exploding.External.AntalPisztoraChemicalDistance, an explicit hypothesis, assumed)"
    - declaration: "Exploding.Frozen.explosive"
      file: "Exploding/Frozen/Explosive.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      literature_dependencies:
        - statement: "Schonmann, On the behavior of some cellular automata related to bootstrap percolation (Exploding.External.SchonmannBootstrap, an explicit hypothesis; proved in this repository by Exploding.xsr_schonmann)"
    - declaration: "Exploding.Frozen.generalized_convergence"
      file: "Exploding/Frozen/GeneralizedConvergence.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      literature_dependencies:
        - statement: "Liggett, Schonmann and Stacey, Domination by product measures, Theorem 0.0 (Exploding.External.LiggettSchonmannStacey, an explicit hypothesis; proved in this repository by Exploding.xlse_lss_general)"
        - statement: "Liggett, Schonmann and Stacey, Domination by product measures, Corollary 1.4 (Exploding.External.LiggettSchonmannStaceyBoundedDegree, an explicit hypothesis; proved in this repository by Exploding.xlse_lss_bounded_degree)"
        - statement: "Mathieu, Quenched invariance principles for random walks with random conductances, Lemma 5.2 (Exploding.External.MathieuHoleVolume, an explicit hypothesis; proved in this repository by Exploding.xmf_proved)"
        - statement: "Antal and Pisztora, On the chemical distance for supercritical Bernoulli percolation, Theorem 1.1 (Exploding.External.AntalPisztoraChemicalDistance, an explicit hypothesis, assumed)"
    - declaration: "Exploding.Frozen.counterexample"
      file: "Exploding/Frozen/Counterexample.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      literature_dependencies:
        - statement: "Fey, Meester and Redig, Stabilizability and percolation in the infinite volume sandpile model, Theorem 2.8 (Exploding.External.FeyMeesterRedigLeastAction, an explicit hypothesis; proved in this repository by Exploding.xfmr_proved)"

fidelity:
  divergences: >-
    The formalized paper is the corrected copy paper/exploding.tex, and
    paper/CHANGES_FROM_ARXIV.md lists each difference from the arXiv version.
    CORRESPONDENCE.md records how each statement of the paper is read in Lean.
    In summary: arrival and crossing times are valued in the extended naturals, so
    that the paper's infinity is not a junk value, and bounds against real quantities
    assert a natural number equal to the time; locally uniform convergence is written
    in its epsilon form; the finiteness of a component or of a bounding rectangle is
    carried where a cardinality would otherwise absorb it; the standing hypotheses of
    Sections 2 to 4 are explicit hypotheses of the deterministic lemmas; "convex
    domain" is a nonempty open convex set; Proposition 7.2 writes the paper's d as
    d + 1. Lemma 3.2 version 7 includes the valid Bernoulli endpoint p = 1;
    nine other registered Bernoulli paper rows still restrict p to (0, 1),
    although the pinned source's "Fix p > 0" also includes the deterministic
    background with 2d - 1 chips at every site.

review:
  status: "author-verified"
  reviewers:
    - "Ahmed Bou-Rabee"
  notes: >-
    The Lean kernel checks the proofs of the declarations as stated. Fidelity to
    the source, including the remaining p = 1 endpoints and later corrected draft,
    requires separate review. Cited results remain explicit hypotheses, except
    the six that are also proved here. This is not external peer review.

alignment:
  namespace: "Exploding"
  statements:
    - source: "Theorem 1.2 (theorem:limit_shape)"
      lean: "Exploding.Frozen.limit_shape"
      module: "Exploding.Frozen.LimitShape"
      status: "proved"
      note: "Takes the three percolation results behind Proposition 2.2 and Schonmann's bound as explicit hypotheses; only the chemical distance of Antal and Pisztora is not proved in this repository. Comparator surface: ExplodingAudit/LimitShape/."
    - source: "Theorem 1.3 (theorem:convergence_of_time_constant)"
      lean: "Exploding.Frozen.convergence_of_time_constant"
      module: "Exploding.Frozen.TimeConstant"
      status: "proved"
      note: "Takes the cited Theorem 1.1, which Exploding.xsr_flp proves, and the three percolation results as explicit hypotheses."
    - source: "Theorem 1.4 (theorem:explosive)"
      lean: "Exploding.Frozen.explosive"
      module: "Exploding.Frozen.Explosive"
      status: "proved"
      note: "Takes Schonmann's bound as an explicit hypothesis, which Exploding.xsr_schonmann proves."
    - source: "Theorem 5.1 (Convergence of the exploding sandpile)"
      lean: "Exploding.Frozen.generalized_convergence"
      module: "Exploding.Frozen.GeneralizedConvergence"
      status: "proved"
      note: "Takes the general domination theorem and the three percolation results as explicit hypotheses."
    - source: "Theorem 6.1 (theorem:counterexample)"
      lean: "Exploding.Frozen.counterexample"
      module: "Exploding.Frozen.Counterexample"
      status: "proved"
      note: "This is the pinned historical-source statement, not the later corrected-draft claim. It takes the least-action principle as an explicit hypothesis, which Exploding.xfmr_proved proves."
    - source: "The paper's other propositions and lemmas and Propositions 7.2, 7.3, excluding Lemma 3.2"
      lean: "Exploding.* in Exploding/MainTheorems.lean"
      module: "Exploding.MainTheorems"
      status: "proved"
      note: "Public wrappers restate the other registered Frozen declarations. The full historical-source map is in README.md and CORRESPONDENCE.md."
    - source: "Lemma 3.2 (lemma:finite_exploding)"
      lean: "Exploding.Frozen.finite_exploding"
      module: "Exploding.Frozen.FiniteExploding"
      status: "proved"
      note: "Version 7 includes p = 1 and passed independent statement review, a full isolated build and the configured gates. Nine other Bernoulli rows and the separate corrected arXiv draft still have source-fidelity gaps."

acknowledgements: >-
  Built on Lean 4, Mathlib, Lake, the shared library Lattice-Probability, and
