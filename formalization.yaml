version: "v0.4"

project:
  name: "A shape theorem for exploding sandpiles"
  description: >-
    A Lean 4 formalization of the paper "A shape theorem for exploding sandpiles" by Bou-Rabee
    (Annals of Applied Probability 34(1A) (2024); arXiv:2102.04422), in the corrected edition of
    its arXiv v2 source. The results are Theorems 1.2, 1.3, 1.4, 5.1 and 6.1, the numbered
    propositions and lemmas of the corrected edition, and its Remark 1. All 22 numbered results and
    Remark 1 are proved, from three cited results that enter as explicit hypotheses. The
    comparator pair under ExplodingAudit/LimitShape/ restates Theorem 1.2 over Mathlib alone.
  authors:
  - Ahmed Bou-Rabee
  responsible_maintainers:
  - Ahmed Bou-Rabee
  license: Apache-2.0

classification:
  arxiv:
  - math.PR
  msc2020:
  - 60K35
  - 60K37

sources:
- title: A shape theorem for exploding sandpiles
  authors:
  - Ahmed Bou-Rabee
  id: doi:10.1214/23-AAP1976
  url: https://arxiv.org/abs/2102.04422
  type: journal article
  relationship: published version, corrected in the corrected edition
  note: "Annals of Applied Probability 34(1A) (2024), 714-742; arXiv:2102.04422."
- title: A shape theorem for exploding sandpiles, arXiv v2 source
  authors:
  - Ahmed Bou-Rabee
  id: arXiv:2102.04422v2
  url: https://arxiv.org/abs/2102.04422v2
  type: arXiv source
  location: paper/exploding-arxiv.tex
  relationship: unmodified source of the corrected edition
- title: A shape theorem for exploding sandpiles, corrected edition
  authors:
  - Ahmed Bou-Rabee
  type: corrected source
  location: paper/corrected-arxiv/exploding-corrected-arxiv.tex
  relationship: formalized
  note: "The statements follow this text. Its section \"Corrections to the published version\" lists every change from arXiv v2."

related_formalizations:
- id: https://github.com/nitromannitol/Lattice-Probability
  relationship: builds-on
  note: "Lattice-Probability, at commit 78f4b2cec065fa2fb5116b06c41966855f62cf50."

status:
  scope: >-
    All 22 numbered results of the corrected edition and its Remark 1 are proved in Lean, with no `sorry` and only the standard axioms, from three cited results that enter as explicit hypotheses; Theorem 6.1 is stated as published, Theorems 1.2 and 1.3 as published with the law (2) read as one common law at every site, and Theorems 1.4 and 5.1 with the corrections listed in the corrected edition; Theorem 5.1 also assumes Hypothesis 1 in a stronger form than printed, and whether it holds under the printed form is open.
  sorry_count: 0
  sorry_count_scope: "Exploding/ (the production library)"
  comparator_challenge_sorry_count: 1
  sorry_in_definitions: 0
  axioms:
  - propext
  - Classical.choice
  - Quot.sound
  main_results:
  - declaration: "Exploding.limit_shape"
    file: "Exploding/MainTheorems.lean"
    statement: "Theorem 1.2"
    sorry_count: 0
    axioms: ["propext", "Classical.choice", "Quot.sound"]
    comparator_config: "ExplodingAudit/LimitShape/comparator.json"
    literature_dependencies:
    - "Antal and Pisztora, Theorem 1.1 (hChem), an explicit hypothesis"
  - declaration: "Exploding.convergence_of_time_constant"
    file: "Exploding/MainTheorems.lean"
    statement: "Theorem 1.3"
    sorry_count: 0
    axioms: ["propext", "Classical.choice", "Quot.sound"]
    comparator_config: "none"
    literature_dependencies:
    - "Antal and Pisztora, Theorem 1.1 (hChem), an explicit hypothesis"
  - declaration: "Exploding.explosive"
    file: "Exploding/MainTheorems.lean"
    statement: "Theorem 1.4"
    sorry_count: 0
    axioms: ["propext", "Classical.choice", "Quot.sound"]
    comparator_config: "none"
    literature_dependencies: []
  - declaration: "Exploding.generalized_convergence"
    file: "Exploding/MainTheorems.lean"
    statement: "Theorem 5.1"
    sorry_count: 0
    axioms: ["propext", "Classical.choice", "Quot.sound"]
    comparator_config: "none"
    literature_dependencies:
    - "Antal and Pisztora, Theorem 1.1 (hChem), an explicit hypothesis"
  - declaration: "Exploding.counterexample"
    file: "Exploding/MainTheorems.lean"
    statement: "Theorem 6.1"
    sorry_count: 0
    axioms: ["propext", "Classical.choice", "Quot.sound"]
    comparator_config: "none"
    literature_dependencies: []

automation:
  methods:
    - method: "agent"
      models:
        - "claude-opus-5"
        - "claude-sonnet-5"
        - "claude-opus-5-5"
        - "claude-haiku-5-5"
      framework: "Claude Code (Anthropic) and the Pi agent harness"
      tool_setup: >-
        Lean proof development and review under the Lean toolchain and the Mathlib and
        Lattice-Probability revisions of this repository; each change was checked by a Lake build
        and by tools/verify.py.
      cost:
        wall_time: "not tracked"
        spend_usd: "not tracked"
        hardware: "local Linux machine"
      prompting_notes: >-
        Human-directed work, closely supervised by the author, on statements the author fixed.
    - method: "agent"
      models:
        - "gpt-6-sol"
        - "gpt-6-luna"
        - "gpt-6.1-sol"
      framework: "Codex CLI (OpenAI)"
      tool_setup: >-
        Lean proof development under the same toolchain and dependency revisions.
      cost:
        wall_time: "not tracked"
        spend_usd: "not tracked"
        hardware: "local Linux machine"
      prompting_notes: >-
        Human-directed work; each task fixed the statements to be proved and forbade changing them.
    - method: "agent"
      models:
        - "gpt-6-astra"
      framework: "Codex CLI (OpenAI)"
      tool_setup: >-
        Mathematical review of the pairwise form of Hypothesis 1; no Lean work.
      cost:
        wall_time: "not tracked"
        spend_usd: "not tracked"
        hardware: "local Linux machine"
      prompting_notes: >-
        Review of the mathematics only.
    - method: "agent"
      models:
        - "deepseek-v4.1-flash"
        - "leanstral"
      framework: "API-hosted model driven by project scripts"
      tool_setup: >-
        Auxiliary proof search on small typed proof obligations.
      cost:
        wall_time: "not tracked"
        spend_usd: "not tracked"
        hardware: "API-only"
  spend_usd: "not tracked"
  notes: >-
    The Lean code was written by AI coding agents under the close supervision of the author, who
    fixed the statements to be formalized. Every proof is checked by the Lean kernel; the library
    contains no sorry and no custom axiom. The model identifiers listed are those recorded during
    the work.

fidelity:
  divergences: >-
    The Lean statements follow the corrected edition in paper/corrected-arxiv/. Theorem 6.1 is
    stated as published, and Theorems 1.2 and 1.3 as published with the law (2) read as one common
    law at every site (C01, C02). Theorem 1.4 carries C03, and Theorem 5.1 carries C11, C05 and
    C13 and assumes Hypothesis 1 in the stronger form of C12. The changes C01 to C25 to the statements, lemmas, propositions, definitions and proofs
    are listed, with the published text, the corrected text and a reason, in the corrected edition's
    section "Corrections to the published version" and in README.md. Hypothesis 1 is used in the form
    that two finite families at distance more than K are independent (C12); whether Propositions 5.1
    and 7.1 and Theorem 5.1 hold under the printed pairwise form is open.

review:
  status: "model review"
  reviewers:
  - "Claude Opus 5.5, separate read-only review of the statements, cited results, documentation and repository against the published paper and the corrected edition (2026-10-19); outcome: the Lean statements and proofs were found sound, and the documentation and the corrected edition needed the changes made since (the corrections list, the status of Hypothesis 1, the house-style pass and a single source)"
  notes: >-
    Every proof is checked by the Lean kernel. This is a model review, not external peer review.

alignment:
  namespace: Exploding
  statements:
  - source: "Theorem 1.1 (quoted in the paper)"
