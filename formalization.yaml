fidelity:
  divergences: 'The formalized paper is the corrected copy paper/exploding.tex, and paper/CHANGES_FROM_ARXIV.md
    lists each difference from the arXiv version. CORRESPONDENCE.md records how each statement of the
    paper is read in Lean.  In summary: arrival and crossing times are valued in the extended naturals,
    so that the paper''s infinity is not a junk value, and bounds against real quantities assert a natural
    number equal to the time; locally uniform convergence is written in its epsilon form; the finiteness
    of a component or of a bounding rectangle is carried where a cardinality would otherwise absorb it;
    the standing hypotheses of Sections 2 to 4 are explicit hypotheses of the deterministic lemmas; "convex
    domain" is a nonempty open convex set; and Proposition 7.2 writes the paper''s d as d + 1.'
review:
  status: author-verified
  reviewers:
  - Ahmed Bou-Rabee
  notes: Correctness of every proved result is guaranteed by the Lean kernel and Mathlib; the cited results
    are assumed rather than proved. The author decided the statement-level questions recorded during development.
    This is not external peer review.
alignment:
  namespace: Exploding
  statements:
  - source: Theorem 1.2 (theorem:limit_shape)
    lean: Exploding.Frozen.limit_shape
    module: Exploding.Frozen.LimitShape
    status: proved
    note: Sealed; takes the three percolation results behind Proposition 2.2 and Schonmann's bound as
      explicit hypotheses.
  - source: Theorem 1.3 (theorem:convergence_of_time_constant)
    lean: Exploding.Frozen.convergence_of_time_constant
    module: Exploding.Frozen.TimeConstant
    status: proved
    note: Sealed; takes the cited Theorem 1.1 and the three percolation results as explicit hypotheses.
  - source: Theorem 1.4 (theorem:explosive)
    lean: Exploding.Frozen.explosive
    module: Exploding.Frozen.Explosive
    status: proved
    note: Sealed; takes Schonmann's bound as an explicit hypothesis.
  - source: Theorem 5.1 (Convergence of the exploding sandpile)
    lean: Exploding.Frozen.generalized_convergence
    module: Exploding.Frozen.GeneralizedConvergence
    status: proved
    note: Sealed; takes the general domination theorem and the three percolation results as explicit hypotheses.
  - source: Theorem 6.1 (theorem:counterexample)
    lean: Exploding.Frozen.counterexample
    module: Exploding.Frozen.Counterexample
    status: proved
    note: Sealed; its least-action hypothesis is discharged by Exploding.xfmr_proved.
  - source: The paper's other propositions and lemmas and Propositions 7.2, 7.3
    lean: Exploding.* in Exploding/MainTheorems.lean
    module: Exploding.MainTheorems
    status: proved
    note: Each of the 22 sealed results restates its certified counterpart Exploding.Frozen.* unchanged;
      the full map is in README.md and CORRESPONDENCE.md.
acknowledgements: Built on Lean 4, Mathlib, Lake and the shared library Lattice-Probability. The seven
  assumed results are due to Fey, Levine and Peres; Schonmann; Liggett, Schonmann and Stacey; Antal and
  Pisztora; Mathieu; and Fey, Meester and Redig.
