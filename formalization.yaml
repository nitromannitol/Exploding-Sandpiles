status:
  scope: >-
    Mixed-source registry: 39 registrations = 24 journal rows, five official-arXiv
    rows and ten corrected-v10 rows; aggregate 28 theorem rows and 11 definition
    rows. The journal group has 17 theorem rows (11 paper-owned plus six
    cited-input companions) and seven cited-input definitions. The official
    group contains Proposition 3.1, Lemmas 3.5, 3.6, 3.7 and Proposition 4.1 as paper theorem rows. The corrected
    group has six paper theorem rows and four literal definitions; definitions
    add zero theorem coverage. Structural claims are journal 13/24 (11/22
    paper-owned), official arXiv 5/24 (5/22), and corrected-v10 6/24 (6/22);
    exact uncovered sets are the three manifest allowed-gap entries. Aggregate
    manifest states remain 28 PROVED, 11 FROZEN definitions and zero SEALED.
    The global default remains paper/exploding.tex. Proposition 3.1, Lemmas 3.5, 3.6, 3.7 and Proposition 4.1 select
    paper/exploding-arxiv.tex (SHA-256
    f12deba6e481a3d81c6967bc48ecbbdae1df4fa1c5f6248a38990030b308072d)
    with paper/defs.tex input. Ten rows select the corrected-v10 TeX (SHA-256
    59b5ac1a5cdf80c5b550dfc1738414892e0aa3f8cdb0bf03d00c74685a3e1be2)
    and its defs.tex input (SHA-256
    9aba2c73246d79e3c6b87cb1f01cf3e2f636e27c8afd97ccb8ba5c032a9ee65b).
    All seven cited inputs remain registered and unchanged. The counterexample
    and crossing successors have separate receipts; neither has a cited-input binder.
    Corrected-v10 Theorem 1.2 version 5 states 0 < p ≤ 1 under the corrected homogeneous
    law and retains its four cited inputs; its source-marker receipt is
    ledger/audits/2026-10-18-limitshape-v5-source-marker.md.
    The corrected-v10 Theorem 1.3 version 6 retains four cited inputs for the strict
    branch and uses the unconditional ordinary all-high Support theorem at p = 1;
    its source and statement receipt records the exact scope. Official Lemmas 3.5, 3.6 and 3.7 retain explicit cited
    inputs for the strict p < 1 branch and prove p = 1 without them. Proposition 3.1
    version 5 also retains its three cited inputs for the strict branch and uses the
    ordinary Support endpoint theorem at p = 1. Proposition 4.1
    version 5 keeps its three cited inputs for the strict branch and uses the ordinary
    Support endpoint theorem at p = 1. Other
    statements of either revised source lack certification. Lemma 3.2 version 7
    retains its historical-pin p = 1 endpoint; corrected crossing version 4, Theorem 1.2
    version 5, and official Proposition 3.1, Lemmas 3.5, 3.6, 3.7 and Proposition 4.1
    version 5 include 0 < p ≤ 1. Proposition 2.2 version 5 also includes 0 < p ≤ 1 and retains all three cited inputs;
    its conclusion includes the maximal infinite good-cube component and uniqueness of every infinite component.
    No registered Frozen statement keeps a strict Bernoulli endpoint. The comparator remains
    the historical journal Theorem 1.2 (0 < p < 1) only.
