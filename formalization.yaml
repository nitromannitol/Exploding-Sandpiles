fidelity:
  divergences: >-
    The old-source default is paper/exploding.tex. Six declarations override to
    local corrected arXiv-format v10 and defs.tex; the official arXiv extraction remains
    separate. The corrected crossing row explicitly includes terminal one and a positive volume deadline; other corrected-v10 results are not certified here. CORRESPONDENCE.md records how
    each statement of the paper is read in Lean. In summary: arrival and crossing times are
    valued in the extended naturals, so that the paper's infinity is not a junk value, and
    bounds against real quantities assert a natural number equal to the time; locally
    uniform convergence is written in its epsilon form; the finiteness of a component or of
    a bounding rectangle is carried where a cardinality would otherwise absorb it; the
    standing hypotheses of Sections 2 to 4 are explicit hypotheses of the deterministic
    lemmas; "convex domain" is a nonempty open convex set; Proposition 7.2 writes the
    paper's d as d + 1. Lemma 3.2 version 7 includes the valid Bernoulli endpoint p = 1;
    eight remaining registered Bernoulli paper rows still restrict p to (0, 1), although the
    source's "Fix p > 0" also includes that deterministic background.

review:
  status: "author-verified"
  reviewers:
    - "Ahmed Bou-Rabee"
  notes: >-
    The historic review record applies to the old-source baseline. The corrected-v10
    counterexample theorem and four literal definitions separately passed independent source/body/consumer
    audit and all integration checks on 15 October 2026; see
    ledger/audits/2026-10-15-counterexample-v4-promotion.md.

alignment:
  namespace: "Exploding"
  statements:
    - source: "Theorem 1.2 (theorem:limit_shape)"
      lean: "Exploding.Frozen.limit_shape"
      module: "Exploding.Frozen.LimitShape"
      status: "proved"
      note: "Takes the three percolation results behind Proposition 2.2 and Schonmann's bound as explicit hypotheses; only the chemical distance of Antal and Pisztora is not proved in this repository. Comparator surface: ExplodingAudit/LimitShape/."
    - source: "Theorem 1.3 (theorem:convergence_of_time_constant)"
      lean: "Exploding.Frozen.convergence_of_time_constant"
      module: "Exploding.Frozen.TimeConstant"
      status: "proved"
      note: "Takes the cited Theorem 1.1, which Exploding.xsr_flp proves, and the three percolation results as explicit hypotheses."
    - source: "Theorem 1.4 (theorem:explosive)"
      lean: "Exploding.Frozen.explosive"
      module: "Exploding.Frozen.Explosive"
      status: "proved"
      note: "Takes Schonmann's bound as an explicit hypothesis, which Exploding.xsr_schonmann proves."
    - source: "Theorem 5.1 (Convergence of the exploding sandpile)"
      lean: "Exploding.Frozen.generalized_convergence"
      module: "Exploding.Frozen.GeneralizedConvergence"
      status: "proved"
      note: "Takes the general domination theorem and the three percolation results as explicit hypotheses."
    - source: Theorem 6.1 (theorem:counterexample; corrected-v10)
      lean: Exploding.Frozen.counterexample
      module: Exploding.Frozen.Counterexample
      source_pin: paper/corrected-arxiv/exploding-corrected-arxiv.tex; 59b5ac1a5cdf80c5b550dfc1738414892e0aa3f8cdb0bf03d00c74685a3e1be2
      status: proved
      note: Exact declaration approved on 15 October 2026; no hFMR binder. Exact-type compilation,
        axiom checks, full locked build and independent source/body/consumer audit passed.
        The corrected crossing theorem has its separate validation receipt.
    - source: "Proposition 2.1 (prop:crossing_time; corrected-v10)"
      lean: "Exploding.Frozen.crossing_time"
      module: "Exploding.Frozen.CrossingTime"
      source_pin: "paper/corrected-arxiv/exploding-corrected-arxiv.tex; 59b5ac1a5cdf80c5b550dfc1738414892e0aa3f8cdb0bf03d00c74685a3e1be2"
      status: "proved"
      note: >-
        Exact version 4 requires terminal one and a positive volume deadline for all
        permitted seeds under the actual law for 0 < p ≤ 1. No cited-input binder.
        The dated crossing receipt records its exact source, declaration and bounded consumers.
    - source: "The paper's other propositions and lemmas and Propositions 7.2, 7.3, excluding Lemma 3.2 and corrected Proposition 2.1"
      lean: "Exploding.* in Exploding/MainTheorems.lean"
      module: "Exploding.MainTheorems"
      status: "proved"
      note: "Public wrappers restate the other registered Frozen declarations. The full historical-source map is in README.md and CORRESPONDENCE.md."
    - source: "Lemma 3.2 (lemma:finite_exploding)"
      lean: "Exploding.Frozen.finite_exploding"
      module: "Exploding.Frozen.FiniteExploding"
      status: "proved"
      note: "Version 7 includes p = 1 and passed independent statement review, a full isolated build and the configured gates. Eight remaining Bernoulli rows and other statements of the corrected arXiv draft retain source-fidelity gaps."

