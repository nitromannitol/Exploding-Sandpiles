status:
  scope: >-
    Mixed-source registry: 39 registrations = 33 old-source rows and six corrected-v10
    rows; aggregate 28 theorem rows and 11 definition rows. The old group has 26 theorem
    rows (20 paper-owned plus six cited-input companions) and seven cited-input definitions.
    The corrected group has two paper theorem rows and four literal definitions; definitions
    add zero theorem coverage. Structural claims are old 22/24 (20/22 paper-owned) and
    corrected-v10 2/24 (2/22 paper-owned); exact uncovered sets are the two manifest
    allowed-gap entries. The counterexample and its four literal definitions retain their
    completed promotion receipt. The corrected crossing version 4 is PROVED under its own exact source pin;
    its separate receipt records the statement, source correspondence and bounded consumers. Aggregate manifest states remain
    28 PROVED, 11 FROZEN definitions and zero SEALED. The global default remains
    paper/exploding.tex; six rows select the corrected-v10 TeX (SHA-256
    59b5ac1a5cdf80c5b550dfc1738414892e0aa3f8cdb0bf03d00c74685a3e1be2) and defs.tex
    (SHA-256 9aba2c73246d79e3c6b87cb1f01cf3e2f636e27c8afd97ccb8ba5c032a9ee65b).
    Twenty paper-owned baseline results retain their old-source statements. All seven cited
    inputs remain registered and unchanged; neither corrected theorem has a cited-input
    binder. Other corrected-v10 statements lack corrected-source certification. The official
    arXiv extraction remains separate, and the comparator remains historical Theorem 1.2
    only. Lemma 3.2 version 7 retains its historical-pin p = 1 endpoint; corrected crossing
    version 4 includes 0 < p ≤ 1. Eight strict Bernoulli paper rows retain p < 1.
  sorry_count: 0
  sorry_count_scope: "Production library; the comparator challenge has one separately reported intentional sorry"
  comparator_challenge_sorry_count: 1
  sorry_in_definitions: 0
  axioms:
    - "propext"
    - "Classical.choice"
    - "Quot.sound"
  axioms_scope: "Accepted registered theorems, including the corrected-v10 counterexample; exact integrated axiom audit passed"
