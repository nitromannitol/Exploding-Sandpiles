    Lean 4/Mathlib formalization of the paper's results with source selected per manifest
    row. There are 33 rows pinned to the corrected journal source. The
    v4 counterexample and crossing theorems and four literal definitions give six corrected-v10
    rows. The crossing row gives the corrected terminal-and-deadline event; no other corrected-v10 endpoint is certified. Seven historical cited
    inputs remain registered, six also proved in the repository. The comparator remains the
    historical limit-shape pair.
  authors:
    - "Ahmed Bou-Rabee"
  license: "Apache-2.0"

classification:
  arxiv:
    - "math.PR"
  msc2020:
    - "60K35"
    - "60K37"

