name: CI

# Builds the project and the Mathlib-only comparator surface on GitHub-hosted runners
# (`ubuntu-latest`).  No `pull_request` trigger: a fork's pull request would run with this
# repository's Actions cache in scope.  Manual dispatch only until the public release, so that
# pushes to the private repository do not start Mathlib-scale runs; the release adds
# `push: branches: [main]`.
on:
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, axiom audit, checkers
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install elan
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Get the Mathlib cache
        run: lake exe cache get

      # The production build emits no warning: the library contains no `sorry`.
      # tools/check_warnings.py (run by tools/verify.py below) fails on any warning.
      - name: Build
        run: lake build

      # Build the Mathlib-only comparator surface: the challenge elaborates with its one
      # intentional `sorry`, and its vocabulary block is byte-identical to the solution's.
      - name: Build the Mathlib-only comparator surface
        run: lake build ExplodingAudit

      - name: Check the challenge vocabulary is self-consistent
        run: bash ExplodingAudit/check_standalone.sh --vocabulary

      # Build the axiom audit and surface its `#print axioms` output in the log,
      # confirming the proved results use only the standard Mathlib axioms.
      - name: Axiom audit
        shell: bash
        run: |
          set -o pipefail
          lake build Exploding.Meta.AxiomsAudit 2>&1 | tee axioms-audit.log
          if grep 'depends on axioms' axioms-audit.log | grep -vE 'depends on axioms: \[propext, Classical.choice, Quot.sound\]$'; then
            echo "A proved result depends on an axiom other than the three standard ones."
            exit 1
          fi

      - name: Frozen statements, paper correspondence and axiom closures
        run: |
          python3 -m pip install -r tools/requirements.txt
          python3 tools/verify.py
