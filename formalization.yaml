    select corrected-v11. The 29 theorem rows are PROVED; 13 definitions are FROZEN and add zero theorem
    coverage. Historical citation rows retain explicit old source pins. Numbered coverage is 22/24 in
    the corrected draft: the two excluded statements quote cited results. The numbered-environment count does not
    see the planar optimality remark (Remark 1), which has its own PROVED row. Source,
    binder, definition and consumer reviews plus the actual 9842-job native integration are recorded;
    final integrated semantic closure and all final gates remain required. Cited premises stay explicit.
    No paper-owned step is an External. The comparator remains the historical journal limit-shape pair.'
